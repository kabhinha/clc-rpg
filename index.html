function recordKey(x,fields=[]){
  if(!x)return "";
  if(x.id!==undefined && x.id!==null && String(x.id)!=="")return "id:"+String(x.id);
  return "fp:"+fields.map(f=>String(x[f]??"")).join("|");
}
function mergeRecordArrays(localArr,remoteArr,fields=[],mergeFn=null){
  const map=new Map();
  for(const x of (remoteArr||[])){
    const k=recordKey(x,fields);
    map.set(k,deepClone(x));
  }
  for(const x of (localArr||[])){
    const k=recordKey(x,fields);
    const old=map.get(k);
    map.set(k,old?(mergeFn?mergeFn(x,old):{...old,...deepClone(x)}):deepClone(x));
  }
  return [...map.values()];
}

function chooseNewerQuest(a,b){

}
function topicProgressScore(t){
  const ranks={"Not Started":0,"Learning":1,"Practicing":2,"Revising":3,"Exam Ready":4};
  const d=t?.lastTouched?Date.parse(t.lastTouched+"T00:00:00")||0:0;
  return (ranks[t?.status]||0)*10000000000000 + (+t?.mastery||0)*10000000000 + d;
}
function mergeTopics(localTopics,remoteTopics){
  const map=new Map();
  const key=t=>String(t?.id||t?.name||`${t?.subject}|${t?.group}|${t?.detail}`).toLowerCase();

  for(const t of (remoteTopics||[]))map.set(key(t),deepClone(t));

  for(const lt of (localTopics||[])){
    const k=key(lt),rt=map.get(k);
    if(!rt){map.set(k,deepClone(lt));continue}

    const chosen=topicProgressScore(lt)>=topicProgressScore(rt)?lt:rt;
    const other=chosen===lt?rt:lt;
    map.set(k,{
      ...deepClone(other),
      ...deepClone(chosen),
      // Never lose a recorded mastery/status improvement merely because another copy is stale.
      mastery:Math.max(+lt.mastery||0,+rt.mastery||0),
      active:lt.active!==false || rt.active!==false,
      lastTouched:(String(lt.lastTouched||"")>=String(rt.lastTouched||""))?(lt.lastTouched||rt.lastTouched):(rt.lastTouched||lt.lastTouched)
    });
  }
  return [...map.values()];
}
function mergeStatesNonDestructive(localState,remoteState){

  const R=remoteState&&typeof remoteState==="object"?deepClone(remoteState):defaultState();

  const M={...R,...L};

  // Profile/settings: keep meaningful local values, fill blanks from cloud.
  M.profile={...(R.profile||{}),...(L.profile||{})};
  M.settings={...(R.settings||{}),...(L.settings||{})};
  for(const [k,v] of Object.entries(R.settings||{})){
    if(M.settings[k]===undefined || M.settings[k]===null || M.settings[k]==="")M.settings[k]=v;
  }

  // Habit definitions: keep current app list, append any custom/older definitions.
  M.habits=mergeRecordArrays(L.habits,R.habits,["name"],(l,r)=>({...r,...l}));

  // Daily history is merged PER DAY rather than replacing the entire timeline.
  M.daily={};
  const dates=new Set([...Object.keys(R.daily||{}),...Object.keys(L.daily||{})]);
  for(const date of dates){
    const l=L.daily?.[date]||{}, r=R.daily?.[date]||{};
    const habitIds=new Set([...Object.keys(r.habits||{}),...Object.keys(l.habits||{})]);
    const habits={};
    for(const id of habitIds)habits[id]=!!(l.habits?.[id]||r.habits?.[id]);

    M.daily[date]={
      ...r,...l,
      habits,
      study:mergeRecordArrays(l.study,r.study,["subject","task","minutes","questions","correct"],(a,b)=>({...b,...a})),
      mainQuest:chooseNewerQuest(l.mainQuest,r.mainQuest),
      mainQuestCompletion:chooseNewerQuest(l.mainQuestCompletion,r.mainQuestCompletion),
      mainQuestRewardEarned:!!(l.mainQuestRewardEarned||r.mainQuestRewardEarned),
      note:l.note||r.note||""
    };
  }

  M.mocks=mergeRecordArrays(L.mocks,R.mocks,["date","name","score","correct","wrong"],(l,r)=>({...r,...l,pb:!!(l.pb||r.pb)}));
  M.mistakes=mergeRecordArrays(L.mistakes,R.mistakes,["date","subject","topic","type","fix"],(l,r)=>({
    ...r,...l,repaired:!!(l.repaired||r.repaired)
  }));
  M.purchases=mergeRecordArrays(L.purchases,R.purchases,["date","name","cost"],(l,r)=>({...r,...l}));
  M.rewards=mergeRecordArrays(L.rewards,R.rewards,["name","cost"],(l,r)=>({...r,...l}));

  M.revisionSchedule={...(R.revisionSchedule||{}),...(L.revisionSchedule||{})};
  M.revisionDone={...(R.revisionDone||{})};
  for(const [d,v] of Object.entries(L.revisionDone||{}))M.revisionDone[d]=!!(v||M.revisionDone[d]);

  M.topics=mergeTopics(L.topics,R.topics);

  // Latest active Main Quest survives.
  M.activeMainQuest=chooseNewerQuest(L.activeMainQuest,R.activeMainQuest);

  M._sync={
    updatedAt:Date.now(),
    deviceId:getDeviceId(),
    mergeMode:"non-destructive-v1"
  };

  return M;
}

      .from("app_state")
      .select("state,updated_at,schema_version")
      .eq("user_id",cloudUser.id)
      .maybeSingle();
    if(readError)throw readError;
    if(row?.state)remote=normalizeIncomingCloudState(row.state);

    // Critical fix: NEVER replace local state wholesale.
    // Merge logs/vaults/history first, then persist the union to BOTH local and cloud.
    state=normalizeManualQuestState(normalizeLegacyTarget(normalizeSyllabusTopics(
      remote?mergeStatesNonDestructive(state,remote):state
    )));
    state._sync={...(state._sync||{}),updatedAt:Date.now(),deviceId:getDeviceId(),mergeMode:"non-destructive-v1"};
    localStorage.setItem(KEY,JSON.stringify(state));

    const payload={user_id:cloudUser.id,state:state,schema_version:5};
    const {data,error}=await sbClient
      .from("app_state")
      .upsert(payload,{onConflict:"user_id"})
      .select("updated_at")
      .single();

    if(error)throw error;
    cloudMarkSynced(data?.updated_at);
    cloudReady=true;
    cloudSetStatus("Cloud merged & saved ✓",true);
    return true;
  }catch(e){
    cloudSetStatus("Cloud pending — local data is safe",true);
    console.error("Cloud sync failed:",e);
    if(force)toast("☁️ "+cloudErrMessage(e));
    return false;
  }finally{
    cloudSyncing=false;
  }
}
function normalizeIncomingCloudState(raw){

function applyCloudRow(row){

async function beginCloudHandshake(force=false){
  if(!sbClient || !cloudUser)return;
  if(cloudHandshakeUserId===cloudUser.id && cloudReady && !force)return;
  cloudHandshakeUserId=cloudUser.id;
  cloudSetStatus("Checking + merging cloud…",true);

  try{
    const row=await fetchCloudRow();

    if(!row){
      cloudReady=true;
      localStorage.setItem(CLOUD_BIND_KEY,cloudUser.id);
      const ok=await pushStateToCloud(true);
      if(ok){
        cloudSetStatus("First cloud backup created ✓",true);
        toast("☁️ Existing progress backed up");
      }
      return;
    }

    // Critical rule: cloud is NOT allowed to replace the full local state.
    // We take the union of both histories, then upload that merged truth.
    saveRecoverySnapshot("before-login-cloud-merge",state);
    const remote=normalizeIncomingCloudState(row.state);
    state=normalizeManualQuestState(normalizeLegacyTarget(normalizeSyllabusTopics(
      mergeStatesNonDestructive(state,remote)
    )));
    save(false);
    localStorage.setItem(CLOUD_BIND_KEY,cloudUser.id);
    cloudReady=true;

    const ok=await pushStateToCloud(true);
    if(ok){
      cloudSetStatus("Cloud + device merged ✓",true);
      render();
    }
  }catch(e){
    cloudReady=false;
    cloudSetStatus("Cloud unavailable — local data is safe",true);
    console.error("Cloud handshake failed:",e);
    toast("☁️ "+cloudErrMessage(e));
  }
}

async function initCloud(){
  try{
    if(!window.supabase?.createClient){
      cloudSetStatus("Cloud library failed to load");
      return;
    }
    sbClient=window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
    );

    const {data,error}=await sbClient.auth.getSession();
    if(error)throw error;
    cloudUser=data?.session?.user||null;

    if(cloudUser){
      cloudHandshakeUserId="";
      await beginCloudHandshake(true);
    }else{
      cloudSetStatus("Not signed in");
      render();
    }

    sbClient.auth.onAuthStateChange((event,session)=>{
      // Avoid awaiting another Supabase call directly inside this callback.
      setTimeout(async()=>{
        const nextUser=session?.user||null;
        const changed=(nextUser?.id||"")!==(cloudUser?.id||"");
        cloudUser=nextUser;

        if(!cloudUser){
          cloudReady=false;
          cloudHandshakeUserId="";
          cloudSetStatus("Not signed in",true);
          return;
        }
        if(changed)cloudHandshakeUserId="";
        await beginCloudHandshake(false);
        render();
      },0);
    });
  }catch(e){
    console.error("Cloud init failed:",e);
    cloudSetStatus("Cloud unavailable — local data is safe",true);
  }
}

function mainQuestScore(t){
  if(!t.active || t.status==="Exam Ready") return -999;
  let s=priorityPoints(t.priority)+(100-(+t.mastery||0))*.42+(+t.weakness||0)*.65+subjectBoost(t.subject)+mistakeBoost(t);
  if(t.status==="Learning") s+=22;
  if(t.status==="Practicing") s+=14;
  if(t.status==="Not Started") s+=7;
  if(t.due && t.due<=todayISO()) s+=24;
  if(t.lastTouched){
    const gap=daysBetween(t.lastTouched,todayISO());
    s+=clamp(gap,0,16);
  } else s+=5;
  return s;
}

function monthBounds(ym){

  const start=new Date(y,m-1,1,0,0,0);

function cleanText(s){return String(s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()}
function isRevisionCalendarEvent(ev){
  const title=cleanText(ev.summary).toLowerCase();
  const desc=cleanText(ev.description).toLowerCase();
  return (
    desc.includes("mcq recall") ||
    desc.includes("error repair") ||
    desc.includes("revision method") ||
    title.includes("revision") ||
    title.includes("mixed revision test")
  );
}
function parseRevisionEvent(ev){
  const title=cleanText(ev.summary||"Revision");
  const desc=cleanText(ev.description||"");
  let subject="",focus="";
  const parts=title.split(/\s+[—–-]\s+/);
  if(parts.length>1){subject=parts.shift().trim();focus=parts.join(" — ").trim()}
  else {subject=title;focus=""}
  subject=subject.replace(/\s+Revision$/i,"").replace(/^Revision\s+/i,"").trim();
  if(/^Mixed Revision Test/i.test(title)){subject="Mixed";focus=title.replace(/^Mixed Revision Test\s*[—–-]?\s*/i,"").trim()||"Mixed revision test"}
  const fm=desc.match(/Focus:\s*(.*?)(?:\s+Method:|\s+Revision method:|$)/i);
  if(!focus && fm)focus=fm[1].trim();
  if(!focus)focus="Revision block";
  return {subject,focus,title};
}
async function syncGoogleCalendarMonth(ym){

  const url=`https://www.googleapis.com/calendar/v3/calendars/${cal}/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${encodeURIComponent(b.start)}&timeMax=${encodeURIComponent(b.end)}`;
  try{
    toast("Syncing revision calendar…");
    const resp=await fetch(url,{headers:{Authorization:`Bearer ${googleCalendarToken}`}});
    if(resp.status===401){googleCalendarToken="";googleCalendarTokenExpiresAt=0;toast("Google session expired — connect again");return}
    if(!resp.ok)throw new Error("Calendar API "+resp.status);
    const data=await resp.json();
    const matched=(data.items||[]).filter(isRevisionCalendarEvent);
    const imported=[];
    matched.forEach(ev=>{
      const date=eventDateKey(ev); if(!date)return;
      const parsed=parseRevisionEvent(ev);
      state.revisionSchedule[date]={subject:parsed.subject,focus:parsed.focus,googleEventId:ev.id||"",source:"google",title:parsed.title};
      imported.push({date,...parsed});
    });
    state.settings.lastCalendarSync=new Date().toISOString();
    save();
    render();
    showCalendarSyncResult(ym,imported);
  }catch(err){
    console.error(err);toast("Calendar sync failed");
  }
}

}

function renderTopicList(){
  const f=currentPlannerFilters(), q=getMainQuest(), li=mainQuestLockInfo();
  const selectionLocked=!!(q && li.locked);
  const filtered=[...state.topics].filter(t=>
    (!f.subject||t.subject===f.subject) &&
    (!f.group||t.group===f.group) &&
    (!f.search||(t.name+" "+t.subject+" "+t.group).toLowerCase().includes(f.search))
  ).sort((a,b)=>a.subject.localeCompare(b.subject)||a.group.localeCompare(b.group)||a.name.localeCompare(b.name));

  if(!filtered.length)return `<div class="empty">No topic matches this filter.</div>`;

  return filtered.map(t=>`

      <div class="topicTop"><div><div class="topicName">${esc(t.detail||t.name)}</div>

function lockTopic(id){
  const t=state.topics.find(x=>x.id===id); if(!t)return;
  const existing=getMainQuest(), li=mainQuestLockInfo();

  if(existing && li.locked){
    toast(`🔒 Current Main Quest locked • ${fmtRemaining(li.remainingMs)}`);
    showPage("home");
    return;
  }

  if(existing && !li.locked) archiveReplacedQuest();

  const now=Date.now();
  const q={
    topicId:t.id,
    subject:t.subject,
    title:t.detail||t.name,
    objective:questObjective(t),
    selectedAt:now,
    lockedUntil:now+24*60*60*1000,
    selectedOn:todayISO(),
    source:"manual"
  };
  state.activeMainQuest=q;

  // Keep an assignment snapshot in that day's history; no reward until cleared.
  day().mainQuest={...q,done:false};
  save();
  toast("👑 Main Quest selected • locked for 24h");
  showPage("home");
}

function saveTopic(id){const t=state.topics.find(x=>x.id===id);t.mastery=clamp(+document.getElementById("tm").value||0,0,100);t.weakness=clamp(+document.getElementById("tw").value||0,0,100);t.status=document.getElementById("ts").value;t.priority=document.getElementById("tp").value;t.due=document.getElementById("td").value;t.lastTouched=document.getElementById("tl").value;save();closeModal();render()}
function openAddTopic(){modal(`<h2>Add Custom Topic</h2><div class="field"><label>Subject</label><input class="input" id="naSub"></div>
<div class="field" style="margin-top:9px"><label>Chapter / Group</label><input class="input" id="naGroup"></div>
<div class="field" style="margin-top:9px"><label>Topic</label><input class="input" id="naName"></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="addTopic()">Add to Queue</button>`)}
function addTopic(){const subject=document.getElementById("naSub").value||"Other",group=document.getElementById("naGroup").value||"Custom",detail=document.getElementById("naName").value||"New Topic";state.topics.push({id:"t"+Date.now(),subject,group,detail,name:`${group} - ${detail}`,priority:"P1",mastery:0,status:"Not Started",weakness:15,lastTouched:"",due:"",active:true});save();closeModal();render()}
function buyReward(i){const r=state.rewards[i];if(totalCoins()<r.cost){toast("🪙 Not enough coins yet");return}state.purchases.push({name:r.name,cost:r.cost,date:todayISO()});save();toast("🎁 Reward unlocked — guilt-free!");confetti();render()}
function saveSettings(){state.profile.name=document.getElementById("setName").value;state.profile.targetScore=+document.getElementById("setTarget").value||290;state.profile.examDate=document.getElementById("setExam").value;state.settings.streakThreshold=clamp(+document.getElementById("setStreak").value||6,1,10);save();toast("Settings saved");render()}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download=`CLC_RPG_Backup_${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(el){const f=el.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{state=normalizeManualQuestState(normalizeLegacyTarget(normalizeSyllabusTopics(JSON.parse(rd.result))));save();toast("Backup restored • cloud sync queued");render()}catch(e){toast("Invalid backup file")}};rd.readAsText(f)}
function resetApp(){if(confirm(cloudUser?"Reset ALL app data on this device AND sync the reset to cloud? Export a backup first.":"Reset all app data? Export a backup first if needed.")){state=defaultState();save();render();toast("Fresh mission created")}}
function modal(x){document.getElementById("modalBody").innerHTML=x;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove("show"),1800)}
function popXP(){document.querySelector(".avatar")?.classList.add("xpPop");setTimeout(()=>document.querySelector(".avatar")?.classList.remove("xpPop"),600)}
function confetti(){for(let i=0;i<18;i++){const e=document.createElement("div");e.className="confetti";e.textContent=["✨","⚡","🏆","🪙","🔥"][i%5];e.style.left=(45+Math.random()*10)+"vw";e.style.top="48vh";e.style.setProperty("--x",(Math.random()*400-200)+"px");e.style.setProperty("--y",(-100-Math.random()*350)+"px");document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
function drawMockChart(){
 const c=document.getElementById("mockChart");if(!c)return;const ctx=c.getContext("2d"), w=c.width,h=c.height;
 ctx.clearRect(0,0,w,h);ctx.strokeStyle="#273858";ctx.lineWidth=1;
 [0,100,200,300].forEach(v=>{const y=h-30-v/300*(h-50);ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillStyle="#64748b";ctx.font="18px sans-serif";ctx.fillText(v,2,y+6)});
 const arr=state.mocks.slice(-12);if(!arr.length){ctx.fillStyle="#64748b";ctx.font="24px sans-serif";ctx.fillText("Log your first boss fight 👀",w/2-125,h/2);return}
 ctx.strokeStyle="#8b5cf6";ctx.lineWidth=5;ctx.beginPath();
 arr.forEach((m,i)=>{const x=48+i*((w-75)/Math.max(1,arr.length-1)),y=h-30-(+m.score||0)/300*(h-50);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillStyle="#22d3ee";ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill()});ctx.stroke()
}
function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===id));document.querySelectorAll(".navBtn").forEach(x=>x.classList.toggle("active",x.dataset.page===id));window.scrollTo({top:0,behavior:"smooth"});if(id==="arena")setTimeout(drawMockChart,0)}
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;});
async function installPWA(){
  if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}
  toast("Browser menu → Add to Home screen / Install app");
}
document.querySelectorAll(".navBtn").forEach(b=>b.onclick=()=>showPage(b.dataset.page));

// One-file cloud release helper: clear PWA caches only. NEVER delete app localStorage/progress.
if("caches" in window && !localStorage.getItem("clc-cloud1-cache-refreshed")){
  caches.keys().then(keys=>Promise.all(
    keys.filter(k=>k.startsWith("clc-rpg")).map(k=>caches.delete(k))
  )).finally(()=>localStorage.setItem("clc-cloud1-cache-refreshed","1"));
}

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>reg.update().catch(()=>{})).catch(()=>{});
}
day();save(false);
maybeRecoverySnapshot("app-start");
render();
initCloud();
</script>
