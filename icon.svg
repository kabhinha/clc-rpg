<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151f"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe49a"/>
      <stop offset="45%" stop-color="#f2bf45"/>
      <stop offset="100%" stop-color="#b97809"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#bg)"/>
  <rect x="27" y="27" width="458" height="458" rx="100"
        fill="none" stroke="url(#gold)" stroke-width="6" opacity=".9"/>

  <!-- Crown / mission mark -->
  <path d="M138 145 L184 177 L225 121 L256 176 L287 121 L328 177 L374 145 L350 230 H162 Z"
        fill="none" stroke="url(#gold)" stroke-width="15" stroke-linejoin="round"
        filter="url(#glow)"/>
  <path d="M171 230 H341" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>

  <!-- Main target -->
  <text x="256" y="337"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="118"
        font-weight="900"
        letter-spacing="-8"
        fill="url(#gold)">290+</text>

  <!-- Legal / CLC cue -->
  <text x="256" y="404"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="47"
        font-weight="800"
        letter-spacing="9"
        fill="#f6f0df">CLC</text>

  <!-- Tiny progress slash -->
  <path d="M173 431 H339" stroke="#f2bf45" stroke-width="7" stroke-linecap="round" opacity=".85"/>
</svg>
